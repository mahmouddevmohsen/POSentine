# POSentine — ONE-OFF read-only forensic diagnostic (2026-08-11 audit)
#
# Manual dispatch only, no schedule. Runs diagnostics_forensic.py, which
# issues SELECT/count calls only — no insert/update/delete anywhere in it,
# no Telegram call, no POS connection. Meant to be deleted once the Aug 9/10
# discrepancy audit is closed.

name: POSentine diagnostics (one-off, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install cloud dependencies
        run: pip install -r requirements-cloud.txt

      - name: Structural guard — read-only, no writes in this script
        run: |
          set -euo pipefail
          if grep -nE '\.insert\(|\.upsert\(|\.update\(|\.delete\(|\.insert_ignore\(' diagnostics_forensic.py; then
            echo "::error::diagnostics_forensic.py must be read-only — found a write call"
            exit 1
          fi
          echo "diagnostics script confirmed read-only"

      - name: Run forensic diagnostic
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SOURCE_ID: ${{ secrets.SOURCE_ID }}
        run: python diagnostics_forensic.py
