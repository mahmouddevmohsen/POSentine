# POSentine — Phase 2 Task 4: the cloud delivery workflow
#
# Runs the delivery half of POSentine on a schedule and on demand:
#   orchestrator.py (decide what to build, enqueue into outbox)
#     → notifier/telegram.py (claim outbox rows, send via Telegram)
#   composed by delivery.py in ONE process, so any failure fails the job.
#
# A delivery system that fails silently is worse than one that does not
# exist — this workflow fails loudly. Every unhandled exception in the
# orchestrator, the notifier, or the Telegram/Supabase HTTP layers exits
# non-zero and paints the job red.
#
# SECRETS — referenced by NAME only. Values live in Settings → Secrets and
# variables → Actions. No secret value ever appears in this file, in source,
# in logs, or in reports:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN,
#   TENANT_ID, SOURCE_ID
#
# POS ISOLATION — nothing in this workflow connects to the customer POS:
# no pyodbc, no SQL Server, no agent.py, nothing installed on the till. The
# only dependencies installed are requirements-cloud.txt (requests, pytest,
# tzdata), and a structural guard below fails the job if pyodbc ever appears
# in the delivery closure.

name: POSentine delivery

on:
  schedule:
    - cron: '*/15 * * * *'    # every 15 minutes (GitHub may drift 5-20 min)
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Build and print the full Arabic report to the job log. Enqueues
          NOTHING and sends NOTHING. Default is TRUE — start here.
        type: boolean
        default: true
      force_shift:
        description: Force a specific shift instead of the most-recent-closed rule.
        type: choice
        options:
          - none
          - morning
          - evening
        default: none
      shift_date:
        description: 'Build the report for a specific local date (YYYY-MM-DD).'
        type: string
        required: false

permissions:
  contents: read

# Never cancel an in-flight run: a cancelled send could leave an outbox row
# in 'sending' (which is never re-claimed). Overlapping runs queue instead.
concurrency:
  group: posentine-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install cloud dependencies
        run: pip install -r requirements-cloud.txt

      - name: Verify configuration (GitHub Secrets present)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SOURCE_ID: ${{ secrets.SOURCE_ID }}
        run: |
          set -euo pipefail
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY TELEGRAM_BOT_TOKEN TENANT_ID SOURCE_ID; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing GitHub Secret: $var — add it in Settings → Secrets and variables → Actions"
              exit 1
            fi
          done
          echo "configuration OK: all 5 secrets are set"

      - name: Structural guard — no pyodbc in the delivery closure
        run: |
          set -euo pipefail
          if grep -rn --include='*.py' -E '^[[:space:]]*(import|from)[[:space:]]+pyodbc' delivery.py orchestrator.py notifier/; then
            echo "::error::pyodbc appeared in the delivery closure — the POS-isolation guarantee is broken"
            exit 1
          fi
          echo "delivery closure clean: no pyodbc, no SQL Server connection"

      - name: Resolve run mode
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "mode=dry-run" >> "$GITHUB_ENV"
            echo "::notice::DRY RUN — reports will be printed to this log; nothing will be enqueued and nothing will be sent"
          else
            echo "mode=live" >> "$GITHUB_ENV"
            echo "LIVE run — scheduled delivery (or manual dispatch with dry_run=false)"
          fi

      - name: Run cloud delivery (orchestrator + notifier)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SOURCE_ID: ${{ secrets.SOURCE_ID }}
          FORCE_SHIFT: ${{ inputs.force_shift }}
          SHIFT_DATE: ${{ inputs.shift_date }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "$mode" == "dry-run" ]]; then
            ARGS+=(--dry-run)
          fi
          if [[ -n "$FORCE_SHIFT" && "$FORCE_SHIFT" != "none" ]]; then
            ARGS+=(--force-shift "$FORCE_SHIFT")
          fi
          if [[ -n "$SHIFT_DATE" ]]; then
            if ! [[ "$SHIFT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::shift_date must be YYYY-MM-DD — got '$SHIFT_DATE'"
              exit 1
            fi
            ARGS+=(--shift-date "$SHIFT_DATE")
          fi
          python delivery.py "${ARGS[@]}"
          echo "cloud delivery completed: mode=$mode"
