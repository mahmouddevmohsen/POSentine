[pytest]
# ship/ is a built copy of files that already live in this repository. Left
# to itself pytest walks into it, finds a second test_golden.py with the same
# module name, and fails collection for the whole suite. It is a build
# artefact; the originals are what get tested.
#
# Docs/ and "data UN/" hold live credentials and real customer sales data.
# They are gitignored, and pytest has no business reading them either.
norecursedirs = ship Docs "data UN" .git __pycache__ .pytest_cache venv .venv
